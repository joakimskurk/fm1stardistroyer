# Dinghy: build the packages on GitHub, run the host tests, and on a tag vX.Y publish the release with a build
# attestation (actions/attest-build-provenance): the Firmware Hub shows "Built from source" for exactly these files.
# Star Distroyer's: on every push to main also the page (the site job below).
# The JieLi toolchain comes from pkgman.jieliapp.com (tools/get_toolchain.sh), the AC79 SDK from gitee.com, as in
# sloopDX's and OberVave's workflows. Run by hand (workflow_dispatch) for a test build without a release.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # the release on a tag
      id-token: write          # the attestation's signing identity
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Python packages
        run: python3 -m pip install Pillow

      - name: JieLi toolchain (pkgman.jieliapp.com)
        run: sh tools/get_toolchain.sh

      - name: JieLi AC79 SDK (three files of it are placed in the package)
        run: |
          for i in 1 2 3; do                     # (gitee.com drops a clone now and then: try again)
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK

      - name: Build (the SMK-37 first, the FM-1 last, as the tests expect)
        run: |
          BOARD=smk37 sh build.sh
          BOARD=smk37 MODEL=elite sh build.sh
          BOARD=smk37 MODEL=mke sh build.sh
          sh build.sh

      - name: Host tests
        run: sh tests/run_tests.sh

      - name: Release packages (tags only)
        if: github.ref_type == 'tag'
        run: |
          V="${GITHUB_REF_NAME#v}"
          BOARD=smk37 sh build.sh --release "$V"
          BOARD=smk37 MODEL=elite sh build.sh --release "$V"
          BOARD=smk37 MODEL=mke sh build.sh --release "$V"
          sh build.sh --release "$V"
          ls -l build/stardistroyer-"$V"*.fwsc
          (cd build && sha256sum stardistroyer-"$V"*.fwsc > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: stardistroyer-fwsc
          path: build/stardistroyer*.fwsc
          if-no-files-found: error

      - name: Attest the packages (tags only)
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/stardistroyer-[0-9]*.fwsc

      # (the release builds only, not the dev ones: stardistroyer-smk37.fwsc. No comment inside the files block below:
      # it would be read as part of the pattern, and the release would get only SHA256SUMS, as Dinghy's v0.5 did)
      - name: Release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/stardistroyer-[0-9]*.fwsc
            build/SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # The page (GitHub Pages, https://joakimskurk.github.io/fm1stardistroyer/): Star Distroyer's page and its installer
  # in the browser (Web MIDI), with the package this run built and tested, the demos as the engine renders them
  # (tests/run_sd.sh, web/make_site.py), and the player: the firmware as WebAssembly (web/app/). From main only;
  # Pages takes its site from GitHub Actions (Settings -> Pages).
  site:
    needs: firmware
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: stardistroyer-fwsc
          path: build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4                  # 22: the lab's test imports web/lab/patch.js, an ES module
        with:
          node-version: '22'

      - name: Python packages, ffmpeg (the spectra, the audio), clang and lld (the player)
        run: |
          python3 -m pip install Pillow numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg clang lld

      - name: The engine's tests and the demos (tests/run_sd.sh)
        run: SD_ASAN=0 SD_BENCH_S=5 sh tests/run_sd.sh

      - name: The player (the firmware as WebAssembly, web/app/) and its test
        run: |
          APP_VER="dev-${GITHUB_SHA::7}" sh web/app/build.sh build/web/stardistroyer.wasm
          node tests/web_test.mjs build/web/stardistroyer.wasm

      - name: The lab (web/lab/) against the host's firmware, sample for sample, and its C export compiled
        run: |
          sh tests/run_host.sh tests/scripts/lab.txt
          node tests/lab_test.mjs build/web/stardistroyer.wasm build/host/stardistroyer.wav

      - name: The site
        run: python3 web/make_site.py build/stardistroyer.fwsc "dev-${GITHUB_SHA::7}" _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
